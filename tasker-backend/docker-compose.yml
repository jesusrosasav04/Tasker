services:
  mysql:
    image: mysql:8.0
    container_name: tasker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tasker123
      MYSQL_DATABASE: tasker # las migraciones de initdb necesitan base seleccionada
      TZ: America/Mexico_City
    ports:
      - "3306:3306"
    volumes:
      - tasker-data:/var/lib/mysql
      # Se ejecuta solo la primera vez (cuando el volumen está vacío)
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Migraciones: al agregar una NN_*.sql nueva, súmala aquí también
      - ./scripts/01_password_resets.sql:/docker-entrypoint-initdb.d/02-password_resets.sql:ro
      - ./scripts/02_reportes_soporte.sql:/docker-entrypoint-initdb.d/03-reportes_soporte.sql:ro
      - ./scripts/03_onboarding_google.sql:/docker-entrypoint-initdb.d/04-onboarding_google.sql:ro
      - ./scripts/04_creditos.sql:/docker-entrypoint-initdb.d/05-creditos.sql:ro
      - ./scripts/05_evidencias.sql:/docker-entrypoint-initdb.d/06-evidencias.sql:ro
      - ./scripts/06_identidad.sql:/docker-entrypoint-initdb.d/07-identidad.sql:ro

volumes:
  tasker-data: